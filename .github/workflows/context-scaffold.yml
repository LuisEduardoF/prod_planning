# ---------------------------------------------------------------------------
# Context Scaffold — reusable workflow (`workflow_call`)
#
# Creates or repairs the `context/` documentation tree (business/, product/,
# data/input/, data/output/ + README.md) in the CALLING repository, then opens a
# pull request with it.
#
# Idempotency: REPAIR, never destructive. Only missing directories and .gitkeep
# files are created, and an existing `context/README.md` is never overwritten.
# If nothing needed to change, no branch and no pull request are created and the
# run succeeds quietly.
#
# Inputs:
#   target_path     (string, optional, default ".")
#                   Directory to scaffold `context/` under, relative to the
#                   caller's repo root.
#   workflows_repo  (string, optional, default "LuisEduardoF/prod_planning")
#                   Repo to load `skills/` from. Override only on a fork.
#   workflows_ref   (string, optional)
#                   Ref of workflows_repo to load `skills/` from. Defaults to
#                   the exact commit of THIS file, so the skills always match
#                   the tag the caller pinned.
#
# Secrets:
#   anthropic_api_key (optional) — Anthropic API key for the Claude Code action.
#   github_app_id     (optional) — GitHub App id. If set with github_app_pem, a
#                                  short-lived App token is minted and used
#                                  instead of GITHUB_TOKEN, so the pull request
#                                  this opens can trigger the caller's other
#                                  workflows.
#   github_app_pem    (optional) — GitHub App private key (PEM).
#
# Example caller (.github/workflows/context-scaffold.yml in YOUR repo):
#
#   name: Scaffold context
#   on:
#     workflow_dispatch:
#   permissions:
#     contents: write
#     pull-requests: write
#   jobs:
#     scaffold:
#       uses: LuisEduardoF/prod_planning/.github/workflows/context-scaffold.yml@v1
#       secrets:
#         anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
# ---------------------------------------------------------------------------

name: Context Scaffold

on:
  workflow_call:
    inputs:
      target_path:
        description: "Directory to scaffold context/ under (relative to repo root)"
        type: string
        required: false
        default: "."
      workflows_repo:
        description: "Repo hosting the skills/ folder"
        type: string
        required: false
        default: LuisEduardoF/prod_planning
      workflows_ref:
        description: "Ref of workflows_repo to load skills/ from (defaults to this workflow's own commit)"
        type: string
        required: false
    secrets:
      anthropic_api_key:
        required: false
      github_app_id:
        required: false
      github_app_pem:
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    env:
      # `secrets` is not an allowed context in a step-level `if:`, but it is in a
      # job-level `env:`. Hoist the check here so the step below can test it.
      HAS_APP_CREDS: ${{ secrets.github_app_id != '' && secrets.github_app_pem != '' }}
      TARGET_PATH: ${{ inputs.target_path }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      BRANCH: context-scaffold/run-${{ github.run_id }}

    steps:
      - name: Mint a GitHub App token
        id: app-token
        if: ${{ env.HAS_APP_CREDS == 'true' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.github_app_id }}
          private-key: ${{ secrets.github_app_pem }}

      - name: Resolve the token to use
        id: auth
        env:
          # App token when the caller supplied App credentials, otherwise the
          # caller's GITHUB_TOKEN. Never echoed — written straight to the
          # step output, which the runner masks as a secret.
          TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >>"$GITHUB_OUTPUT"

      # The CALLING repository. No `repository:` override on purpose — under
      # workflow_call this resolves to the caller, which is the repo we scaffold.
      - name: Checkout the calling repository
        uses: actions/checkout@v4
        with:
          # Full history so the `git diff` in the pull request body resolves a
          # merge base against origin/<default branch>.
          fetch-depth: 0
          token: ${{ steps.auth.outputs.token }}

      # This hub repo, for `skills/` only. Checked out AFTER the caller so it
      # isn't wiped, and into a subdirectory so it never becomes the working tree.
      - name: Checkout the skills library
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.workflows_repo }}
          ref: ${{ inputs.workflows_ref || github.job_workflow_sha }}
          path: .prod-planning
          # Lets an App with read access here serve a PRIVATE hub repo.
          token: ${{ steps.auth.outputs.token }}
          # We never push from this checkout, and the agent can read the
          # workspace — don't leave a usable token in .prod-planning/.git/config.
          persist-credentials: false

      - name: Keep the skills checkout out of the caller's index
        run: |
          # Without this, a `git add -A` in a later step would stage the whole
          # skills library into the caller's pull request.
          echo ".prod-planning/" >>"$GITHUB_WORKSPACE/.git/info/exclude"

      - name: Run context-scaffold skill
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          github_token: ${{ steps.auth.outputs.token }}
          # No Bash(git:*)/Bash(gh:*) — version control is the workflow's job,
          # not the agent's, so the agent never needs a writable token.
          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Bash(mkdir:*),Bash(ls:*),Bash(find:*)"
          prompt: |
            Read and follow the instructions in
            `.prod-planning/skills/context-scaffold/SKILL.md` (and its
            `assets/README.template.md`) to scaffold or repair the `context/`
            documentation tree under `${{ inputs.target_path }}`.

            `.prod-planning/` is the skill library only — read from it, never
            write to it and never commit it. The repository you are scaffolding
            is the one checked out at the workspace root
            (`${{ github.repository }}`).

            Follow the skill's steps exactly: inspect before writing, create only
            missing directories/.gitkeep files, and never overwrite an existing
            `context/README.md` (offer a merge instead, as the skill describes).

            Do not create a branch, commit, or pull request — later steps in
            this workflow handle version control. Finish by reporting which
            items you created versus which already existed.

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          # Scaffolding is repair-only: an already-complete context/ leaves the
          # tree clean, and that is a quiet success, not a failure.
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "context/ is already fully scaffolded — nothing to commit."
            exit 0
          fi

          echo "Changes detected:"
          git status --short

          git config user.name "claude[bot]"
          git config user.email "claude[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Scaffold context/ folder"
          git push -u origin "$BRANCH"

          {
            echo "Scaffolds the \`context/\` documentation tree under \`${TARGET_PATH}\` by running"
            echo "the \`context-scaffold\` skill."
            echo
            echo "Files in this branch:"
            echo
            echo '```'
            git diff --name-status "origin/${BASE_BRANCH}...${BRANCH}"
            echo '```'
            echo
            echo "Anything not listed above was already present and was left untouched."
          } >"${{ runner.temp }}/pr-body.md"

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "Scaffold context/ folder" \
            --body-file "${{ runner.temp }}/pr-body.md"
